[project]
name = "vgcjax"
version = "0.0.1"
description = "Faithful pure-JAX engine for Pokemon Champions VGC (Reg M-C), validated against Pokemon Showdown"
requires-python = "==3.12.*"
dependencies = [
  "jax==0.12.0.1",
  "jaxlib==0.12.0.1",
  "flax==0.12.10",
  "chex==0.1.92",
  "numpy",
  "orjson",
  "zstandard",
  "pyarrow",
  "pyyaml",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]==0.12.0.1"]

[dependency-groups]
dev = ["pytest", "hypothesis", "pytest-xdist"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vgcjax", "harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (excluded from T1-fast)"]
addopts = "-q"
